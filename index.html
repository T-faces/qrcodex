<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QR Codex Generator & Scanner</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>
  <h1>QR Codex Generator & Scanner</h1>

  <!-- Generator -->
  <div class="section">
    <h2>Generate QR Code</h2>
    <input type="text" id="qr-input" placeholder="Enter text or URL">
    <button onclick="generateQRCode()">Generate</button>
    <div id="qrcode"></div>
  </div>

  <!-- Scanner -->
  <div class="section">
    <h2>Scan QR Code</h2>
    <div id="reader" style="width:300px;"></div>
    <p>Result: <span id="qr-result"></span></p>
  </div>

  <script>
    function generateQRCode() {
      const input = document.getElementById("qr-input").value;
      const qrCodeDiv = document.getElementById("qrcode");
      qrCodeDiv.innerHTML = ""; // reset
      new QRCode(qrCodeDiv, {
        text: input,
        width: 256,
        height: 256
      });
    }

    const qrResult = document.getElementById('qr-result');
    const html5QrCode = new Html5Qrcode("reader");
    const config = { fps: 10, qrbox: { width: 250, height: 250 } };

    html5QrCode.start(
      { facingMode: "environment" },
      config,
      (decodedText) => {
        qrResult.innerText = decodedText;
        html5QrCode.stop(); // stop after success
      },
      (errorMessage) => {}
    ).catch((err) => {
      console.error("Camera start error:", err);
    });
  </script>
</body>
</html>
